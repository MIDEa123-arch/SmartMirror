; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env]
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    beegee-tokyo/DHT sensor library for ESPx @ 1.19.0
    256dpi/MQTT @ 2.5.3
    bblanchon/ArduinoJson
    bodmer/TFT_eSPI @ 2.5.43
build_flags =
    -DUSER_SETUP_LOADED
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=22
    -DTFT_DC=25
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DSMOOTH_FONT
    -DSPI_FREQUENCY=20000000

[env:esp32dev]
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit FT6206 Library @ ^1.1.0
build_flags =
    ${env.build_flags}
    -DSMARTMIRROR_WOKWI
    -DTFT_MISO=-1
    -DILI9341_DRIVER=1
    -DTFT_RST=-1

[env:esp32dev-hardware]
lib_deps =
    ${env.lib_deps}
    paulstoffregen/XPT2046_Touchscreen @ 0.0.0-alpha+sha.26b691b2c8
build_flags =
    ${env.build_flags}
    -DILI9488_DRIVER=1
    -DTFT_MISO=17
    -DTFT_RST=4

[env:mirror-sensors]
build_src_filter = +<main.cpp> +<panel_sender.cpp>
build_flags = -DSMARTMIRROR_PANEL_UART -DSMARTMIRROR_DHT11 -DSMARTMIRROR_DHT_DISABLED
lib_deps =
    beegee-tokyo/DHT sensor library for ESPx @ 1.19.0
    256dpi/MQTT @ 2.5.3
    bblanchon/ArduinoJson @ ^7

[env:mirror-sensors-debug]
extends = env:mirror-sensors
build_flags = ${env:mirror-sensors.build_flags} -DSMARTMIRROR_HARDWARE_DEBUG

[env:mirror-panel-s3]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<panel_receiver.cpp> +<mirror_display.cpp>
build_flags =
    -DSMARTMIRROR_PANEL_S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    jasonbolbach/ES3C35P @ 1.0.1
    bblanchon/ArduinoJson @ ^7

[env:mirror-panel-s3-debug]
extends = env:mirror-panel-s3
build_flags = ${env:mirror-panel-s3.build_flags} -DSMARTMIRROR_HARDWARE_DEBUG
